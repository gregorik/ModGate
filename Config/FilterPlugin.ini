[FilterPlugin]
; Decides which files UAT BuildPlugin copies into the Fab package, relative to
; the plugin root. "..." matches any number of folders, "*" any characters in a
; name, "?" one character. A leading '-' makes a rule an exclusion. Rules are
; applied in order after UAT's built-in ones, and a later rule wins.
;
; UAT already includes ModGate.uplugin, /Source/..., /Resources/..., /Content/...
; and /Shaders/... by default, and excludes a plugin-root /Tests/... folder. The
; first block repeats the defaults ModGate relies on, so the package contents are
; readable in one place.

; --- Code: ModGate (inspection, rules, reports, audit, commandlet) and
; ModGateEditor (Tools menu) ---------------------------------------------------
/Source/...

; --- Resources read by the plugin --------------------------------------------
; Icon128.png and ModGatePolicy.json (the default policy: allowed file types,
; dangerous engine functions, command text, profiles).
/Resources/...

; --- Additions beyond UAT's defaults ----------------------------------------
/Config/...
/ModGate.uplugin
/README.md
/CHANGELOG.md

; --- Exclusions --------------------------------------------------------------
; Automation tests and their cooked fixtures are development-time only. UAT
; excludes a plugin-root /Tests/ (the fixtures live there) but not per-module
; Source/<Module>/Private/Tests/, so exclude both explicitly.
-/Tests/...
-/Source/.../Tests/...

; Editor and OS droppings, should any appear inside an included folder.
-.../*.bak
-.../*.orig
-.../*.tmp
-.../Thumbs.db
-.../desktop.ini
-.../.DS_Store
